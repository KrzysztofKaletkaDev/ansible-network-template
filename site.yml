---
- name: "Konfiguracja sieci LAN (RouterOS: RB5009 + CRS310)"
  hosts: routers
  connection: local
  gather_facts: false

  # pre_tasks (not tasks) so this runs before any role touches a device.
  pre_tasks:
    - name: Wymagaj jawnego --limit — 'routers' obejmuje edge-router, crs310 i chr-test
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
        fail_msg: >-
          Wszystkie hosty są zagnieżdżone pod 'routers', więc bare site.yml
          trafia naraz w edge-router, crs310 i chr-test. Uruchom z jawnym
          --limit: edge / switches / test (albo --limit routers świadomie).

  # Every community.routeros.api* module opens its own API connection to the
  # router (there is no connection plugin — see docs/adr/0002-*). The shared
  # connection parameters are set once here instead of on each task.
  # tls: false -> plain API (8728), not api-ssl (8729): no certificate is
  # configured on the router and the LAN is the trust boundary (see ADR-0002).
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ ansible_host }}"
      username: "{{ routeros_api_user }}"
      password: "{{ vault_routeros_api_password }}"
      tls: false

  # routeros_common runs on every RouterOS device. The rest are gated by
  # device class: the edge router gets routeros_interfaces -> routeros_dhcp
  # -> routeros_dns -> routeros_firewall; the CRS310 gets routeros_switch.
  roles:
    - routeros_common
    - role: routeros_interfaces
      when: routeros_device_class == 'edge'
    - role: routeros_switch
      when: routeros_device_class == 'switch'
