---
- name: Konfiguracja routera brzegowego MikroTik RouterOS
  hosts: routers
  connection: local
  gather_facts: false

  # pre_tasks (not tasks) so this runs before any role touches the router.
  pre_tasks:
    - name: Wymagaj jawnego --limit — 'routers' obejmuje teraz i produkcję, i CHR
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
        fail_msg: >-
          Odkąd 'test' jest zagnieżdżone pod 'routers', bare site.yml trafia
          jednocześnie w edge-router i chr-test. Uruchom z jawnym
          --limit edge-router albo --limit test.

  # Every community.routeros.api* module opens its own API connection to the
  # router (there is no connection plugin — see docs/adr/0002-*). The shared
  # connection parameters are set once here instead of on each task.
  # tls: false -> plain API (8728), not api-ssl (8729): no certificate is
  # configured on the router and the LAN is the trust boundary (see ADR-0002).
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ ansible_host }}"
      username: "{{ routeros_api_user }}"
      password: "{{ vault_routeros_api_password }}"
      tls: false

  # Roles are added one per commit, in dependency order:
  #   routeros_common -> routeros_interfaces -> routeros_dhcp
  #                   -> routeros_dns -> routeros_firewall
  roles:
    - routeros_common
