[defaults]
# Path to the default inventory
inventory = inventory/hosts.yml

# The community.routeros.api* modules run on the control node and talk to the
# router over the API — there is no SSH connection to a RouterOS device, so no
# remote_user and no privilege escalation section (see docs/adr/0002-*).
host_key_checking = False

# Disable creation of .retry files when a playbook fails
retry_files_enabled = False

# More readable presentation of task results in the terminal (YAML output)
stdout_callback = default
callback_result_format = yaml
